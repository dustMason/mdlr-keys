<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <filter id="knobShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity=".34"/>
    </filter>
    <filter id="knobGrain">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="113" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .16 0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
  </defs>
  <circle cx="48" cy="50" r="36" fill="#000000" opacity=".24" filter="url(#knobShadow)"/>
  <circle cx="48" cy="47" r="34" fill="#828079"/>
  <circle cx="48" cy="45" r="29" fill="#d8d6ca" filter="url(#knobGrain)"/>
  <path d="M22 42 C30 23 59 15 75 34 C63 27 39 28 22 42Z" fill="#e5e4dc" opacity=".22"/>
  <path d="M28 68 C42 78 64 73 75 56" fill="none" stroke="#000000" stroke-opacity=".2" stroke-width="5" stroke-linecap="round"/>
  <circle cx="48" cy="45" r="19" fill="none" stroke="#e5e4dc" stroke-opacity=".12" stroke-width="2"/>
</svg>
