[package]
name = "mdlr-ipad-dsp"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[lib]
name = "mdlr_ipad_dsp"
crate-type = ["staticlib", "rlib"]

[features]
analysis = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1.0", optional = true }

[[bin]]
name = "monologue-render"
path = "src/bin/monologue-render.rs"
required-features = ["analysis"]

[[bin]]
name = "jp8000-render"
path = "src/bin/jp8000-render.rs"
required-features = ["analysis"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
